name: Publish from Google Sheet

concurrency:
  group: publish-main
  cancel-in-progress: true
on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"   # every hour at :15 (you can change later)

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch published items JSON
        env:
          STN_EXPORT_URL: ${{ secrets.STN_EXPORT_URL }}
        run: |
          set -euo pipefail
          curl -fsSL "$STN_EXPORT_URL" -o data/stories.json
          node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('data/stories.json','utf8')); if(!j.items) throw new Error('Invalid JSON (missing items)'); console.log('Items:', j.items.length);"

      - name: Commit & push if changed
              - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "stn-bot"
          git config user.email "stn-bot@users.noreply.github.com"
          git add data/stories.json
          git commit -m "Update published stories"

          # Pull latest remote changes and rebase our commit on top
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main
