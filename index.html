<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Stranger Than Normal</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
  max-width: 820px;
  margin: 80px auto;
  padding: 0 28px;
}


    .site-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 15px;
      color: #666;
      margin-bottom: 50px;
    }

    .story {
  display: block;
  text-decoration: none;
  color: inherit;
  margin-bottom: 30px;
}

.headline {
  font-size: 20px;
  line-height: 1.5;
}

.meta {
  margin-top: 6px;
  font-size: 12px;
  color: #777;
  letter-spacing: 0.2px;
}


    .story:hover {
      opacity: 0.6;
    }

    .section {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin: 50px 0 20px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="site-title">Stranger Than Normal</div>
    <div class="tagline">Reality continues.</div>

    <div id="feed"></div>

<script>
  async function loadFeed() {
    const el = document.getElementById('feed');

    try {
      const res = await fetch('/data/stories.json', { cache: 'no-store' });
      const data = await res.json();
      const items = (data.items || []).slice(0, 35);

      if (!items.length) {
        el.innerHTML = '<div class="story"><div class="headline">Nothing published yet.</div><div class="meta">Mark INBOX rows as Publish.</div></div>';
        return;
      }

      el.innerHTML = items.map(item => {
        const title = escapeHtml(item.display_title || item.title || '');
        const source = escapeHtml(item.source || '');
        const url = item.url || '#';

        return `
          <a class="story" href="${url}" target="_blank" rel="noopener noreferrer">
            <div class="headline">${title}</div>
            <div class="meta">${source}</div>
          </a>
        `;
      }).join('');
    } catch (e) {
      el.innerHTML = '<div class="story"><div class="headline">Feed temporarily unavailable.</div><div class="meta">Try again shortly.</div></div>';
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  loadFeed();
</script>
</body>
</html>
